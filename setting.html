<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setting - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-[#00bcee]">AdminPanel</h1>
        <div class="flex items-center space-x-3">
            <span class="text-sm text-slate-400">Halo, <strong id="userDisplayName" class="text-white">User</strong></span>
            <div id="userAvatar" class="w-8 h-8 rounded-full bg-[#00bcee] text-slate-950 font-bold flex items-center justify-center uppercase">U</div>
        </div>
    </header>

    <div class="flex flex-1">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 border-r border-slate-800 p-4 flex flex-col justify-between">
            <nav class="space-y-2">
                <a href="dashboard.html" class="flex items-center space-x-2 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-[#00bcee] transition">
                    <span>Dashboard</span>
                </a>
                <a href="products.html" class="flex items-center space-x-2 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-[#00bcee] transition">
                    <span>Products</span>
                </a>
                <a href="users.html" class="flex items-center space-x-2 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-[#00bcee] transition">
                    <span>Users</span>
                </a>
                <!-- Highlight menu aktif -->
                <a href="setting.html" class="flex items-center space-x-2 px-4 py-2.5 rounded-lg bg-slate-800 text-[#00bcee] font-medium transition">
                    <span>Setting</span>
                </a>
            </nav>
            
            <div class="pt-4 border-t border-slate-800">
                <button onclick="logout()" class="block text-center w-full px-4 py-2 bg-red-600/20 text-red-400 border border-red-500/30 rounded-lg hover:bg-red-600 hover:text-white transition">
                    Logout
                </button>
            </div>
        </aside>

        <!-- Konten Utama -->
        <main class="flex-1 p-8">
            <div class="max-w-3xl bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
                <h2 class="text-2xl font-bold text-white mb-6">Pengaturan Akun</h2>

                <form onsubmit="event.preventDefault(); alert('Pengaturan berhasil disimpan!');" class="space-y-6">
                    <!-- Section: Profil -->
                    <div class="space-y-4">
                        <h3 class="text-lg font-semibold text-[#00bcee] border-b border-slate-800 pb-2">Informasi Profil</h3>
                        
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Nama Aplikasi / Toko</label>
                            <input type="text" value="My E-Commerce Admin" 
                                class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-[#00bcee] focus:ring-1 focus:ring-[#00bcee] transition">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Email Notifikasi</label>
                            <input type="email" value="admin@store.com" 
                                class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-[#00bcee] focus:ring-1 focus:ring-[#00bcee] transition">
                        </div>
                    </div>

                    <!-- Section: Keamanan -->
                    <div class="space-y-4 pt-4">
                        <h3 class="text-lg font-semibold text-[#00bcee] border-b border-slate-800 pb-2">Keamanan</h3>
                        
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Ganti Password</label>
                            <input type="password" placeholder="Masukkan password baru" 
                                class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-[#00bcee] focus:ring-1 focus:ring-[#00bcee] transition">
                        </div>
                    </div>

                    <!-- Section: Preferensi -->
                    <div class="space-y-4 pt-4">
                        <h3 class="text-lg font-semibold text-[#00bcee] border-b border-slate-800 pb-2">Notifikasi</h3>
                        
                        <div class="flex items-center space-x-3">
                            <input type="checkbox" id="emailNotif" checked class="w-4 h-4 accent-[#00bcee] rounded">
                            <label for="emailNotif" class="text-sm text-slate-300">Kirim email saat ada pesanan baru</label>
                        </div>
                    </div>

                    <!-- Tombol Simpan -->
                    <div class="pt-4">
                        <button type="submit" 
                            class="bg-[#00bcee] text-slate-950 font-bold px-6 py-2.5 rounded-lg hover:bg-[#009bc2] transition duration-200 shadow-lg shadow-[#00bcee]/20">
                            Simpan Perubahan
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-sm text-slate-500">
        &copy; 2026 Admin Template. All rights reserved.
    </footer>

    <script>
        const savedUser = localStorage.getItem('loggedInUser');
        if (savedUser) {
            document.getElementById('userDisplayName').innerText = savedUser;
            document.getElementById('userAvatar').innerText = savedUser.charAt(0);
        }
        function logout() {
            localStorage.removeItem('loggedInUser');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
