<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <!-- CDN Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-gray-900 border border-gray-800 p-8 rounded-xl shadow-2xl text-center max-w-md w-full">
    <!-- Icon Centang / Sukses -->
    <div class="w-16 h-16 bg-[#00bcee]/10 text-[#00bcee] rounded-full flex items-center justify-center mx-auto mb-4 border border-[#00bcee]/30">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin=" His shadow" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
      </svg>
    </div>

    <!-- Judul Ucapan Selamat -->
    <h1 class="text-3xl font-bold text-[#00bcee] mb-2 tracking-wide">
      Registrasi Berhasil!
    </h1>
    
    <!-- Deskripsi Subtitle -->
    <p class="text-gray-400 text-sm">
      Selamat datang di halaman <span class="text-white font-medium">Dashboard</span>.
    </p>
  </div>

</body>
</html>
