<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Produk - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-[#00bcee]">AdminPanel</h1>
        <div class="flex items-center space-x-3">
            <span class="text-sm text-slate-400">Halo, <strong id="userDisplayName" class="text-white">User</strong></span>
            <div id="userAvatar" class="w-8 h-8 rounded-full bg-[#00bcee] text-slate-950 font-bold flex items-center justify-center uppercase">U</div>
        </div>
    </header>

    <div class="flex flex-1">
        <aside class="w-64 bg-slate-900 border-r border-slate-800 p-4 flex flex-col justify-between">
            <nav class="space-y-2">
                <a href="dashboard.html" class="flex items-center space-x-2 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-[#00bcee] transition">
                    <span>Dashboard</span>
                </a>
                <a href="products.html" class="flex items-center space-x-2 px-4 py-2.5 rounded-lg bg-slate-800 text-[#00bcee] font-medium transition">
                    <span>Products</span>
                </a>
                <a href="users.html" class="flex items-center space-x-2 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-[#00bcee] transition">
                    <span>Users</span>
                </a>
                <a href="setting.html" class="flex items-center space-x-2 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-[#00bcee] transition">
                    <span>Setting</span>
                </a>
            </nav>
            
            <div class="pt-4 border-t border-slate-800">
                <button onclick="logout()" class="block text-center w-full px-4 py-2 bg-red-600/20 text-red-400 border border-red-500/30 rounded-lg hover:bg-red-600 hover:text-white transition">
                    Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 p-8">
            <div class="max-w-2xl bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
                <h2 class="text-2xl font-bold text-white mb-6">Edit Produk</h2>

                <form action="products.html" method="GET" class="space-y-5">
                    <div>
                        <label for="name" class="block text-sm font-medium text-slate-300 mb-2">Name</label>
                        <input type="text" id="name" name="name" value="Laptop Gaming Pro" required
                            class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-[#00bcee] focus:ring-1 focus:ring-[#00bcee] transition"
                            placeholder="Masukkan nama produk">
                    </div>

                    <div>
                        <label for="stock" class="block text-sm font-medium text-slate-300 mb-2">Stock</label>
                        <input type="number" id="stock" name="stock" value="25" required
                            class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-[#00bcee] focus:ring-1 focus:ring-[#00bcee] transition"
                            placeholder="Masukkan jumlah stok">
                    </div>

                    <div>
                        <label for="description" class="block text-sm font-medium text-slate-300 mb-2">Description</label>
                        <textarea id="description" name="description" rows="4" required
                            class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-[#00bcee] focus:ring-1 focus:ring-[#00bcee] transition"
                            placeholder="Masukkan deskripsi produk">Laptop gaming performa tinggi dengan prosesor generasi terbaru dan kartu grafis mumpuni.</textarea>
                    </div>

                    <div class="flex items-center space-x-3 pt-2">
                        <button type="submit" 
                            class="bg-[#00bcee] text-slate-950 font-bold px-6 py-2.5 rounded-lg hover:bg-[#009bc2] transition duration-200 shadow-lg shadow-[#00bcee]/20">
                            Update
                        </button>
                        <a href="products.html" 
                            class="bg-slate-800 text-slate-300 font-medium px-6 py-2.5 rounded-lg hover:bg-slate-700 transition duration-200">
                            Batal
                        </a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-sm text-slate-500">
        &copy; 2026 Admin Template. All rights reserved.
    </footer>

    <script>
        const savedUser = localStorage.getItem('loggedInUser');
        if (savedUser) {
            document.getElementById('userDisplayName').innerText = savedUser;
            document.getElementById('userAvatar').innerText = savedUser.charAt(0);
        }
        function logout() {
            localStorage.removeItem('loggedInUser');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
