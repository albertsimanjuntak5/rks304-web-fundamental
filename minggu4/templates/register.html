{% extends 'base.html' %}

{% block title %}Register - WEBSITEKU.COM{% endblock %}

{% block konten %}
<div class="bg-white rounded-lg shadow p-6 max-w-md mx-auto">
    <h2 class="text-2xl font-bold mb-4 text-indigo-600 text-center">Form Pendaftaran</h2>
    <form class="space-y-4">
        <div>
            <label class="block text-sm font-medium mb-1">Nama Lengkap</label>
            <input type="text" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Masukkan nama">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Email</label>
            <input type="email" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Masukkan email">
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition">Daftar</button>
    </form>
</div>
{% endblock %}
