<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-xl shadow-2xl p-8">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold tracking-wide text-white">Admin Login</h1>
            <p class="text-sm text-slate-400 mt-1">Silakan masuk ke akun Anda</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-slate-300 mb-2">Username</label>
                <input type="text" id="username" name="username" required 
                    class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-[#00bcee] focus:ring-1 focus:ring-[#00bcee] transition"
                    placeholder="Masukkan username">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-300 mb-2">Password</label>
                <input type="password" id="password" name="password" required 
                    class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-[#00bcee] focus:ring-1 focus:ring-[#00bcee] transition"
                    placeholder="••••••••">
            </div>

            <div>
                <button type="submit" 
                    class="w-full bg-[#00bcee] text-slate-950 font-bold py-2.5 rounded-lg hover:bg-[#009bc2] transition duration-200 shadow-lg shadow-[#00bcee]/20">
                    Login
                </button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value;
            localStorage.setItem('loggedInUser', usernameInput);
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
